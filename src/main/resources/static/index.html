
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkly | URL 단축 서비스</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Pretendard", "Arial", sans-serif;
            background: #f6f8fc;
            color: #192338;
        }

        header {
            max-width: 1050px;
            margin: auto;
            padding: 28px;
            font-size: 25px;
            font-weight: 800;
            color: #4568ed;
        }

        .hero {
            text-align: center;
            padding: 75px 20px 45px;
        }

        .hero h1 {
            font-size: 48px;
            margin: 0 0 18px;
            line-height: 1.3;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #4568ed;
        }

        .hero p {
            color: #8490a4;
            line-height: 1.8;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(30, 50, 100, 0.07);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            width: 100%;
            min-width: 0;
            padding: 16px;
            border: 1px solid #e0e6f0;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #4568ed;
        }

        button {
            padding: 15px 22px;
            border: none;
            border-radius: 10px;
            background: #4568ed;
            color: white;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: #304fce;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .description {
            margin-top: 12px;
            font-size: 12px;
            color: #98a2b3;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 12px;
            background: #f0f5ff;
        }

        .result h3 {
            margin-top: 0;
            color: #19865c;
            font-size: 14px;
        }

        .short-url {
            display: block;
            color: #4568ed;
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        .original-url {
            font-size: 13px;
            color: #8490a4;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .secondary-button {
            background: white;
            color: #4568ed;
            border: 1px solid #dce4fa;
        }

        .secondary-button:hover {
            background: #e9efff;
        }

        .stats {
            display: none;
            margin-top: 22px;
            background: #f4f7ff;
            padding: 23px;
            border-radius: 12px;
        }

        .stats-count {
            font-size: 35px;
            font-weight: 800;
            color: #4568ed;
        }

        .stats-label {
            font-size: 13px;
            color: #8490a4;
        }

        .message {
            color: #e05252;
            font-size: 13px;
            margin-top: 12px;
        }

        footer {
            text-align: center;
            padding: 45px;
            color: #9ca6b7;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 34px;
            }

            .card {
                padding: 23px;
            }

            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    Linkly.
</header>

<section class="hero">
    <h1>
        긴 링크는 짧게,<br>
        <span>공유는 더 쉽게.</span>
    </h1>

    <p>
        복잡한 URL을 단 8글자의 짧은 링크로 바꿔보세요.<br>
        링크를 만들고, 공유하고, 클릭 횟수까지 확인하세요.
    </p>
</section>

<div class="container">

    <!-- URL 생성 -->
    <div class="card">

        <h2>🔗 단축 URL 생성</h2>

        <form id="shortenForm">

            <label for="originalUrl">원본 URL</label>

            <div class="input-group">

                <input
                        type="url"
                        id="originalUrl"
                        placeholder="https://www.google.com"
                        required
                >

                <button type="submit" id="createButton">
                    URL 단축하기
                </button>

            </div>

            <p class="description">
                http:// 또는 https:// 로 시작하는 URL을 입력하세요.
            </p>

        </form>

        <p class="message" id="createMessage"></p>

        <div class="result" id="result">

            <h3>✓ 단축 URL이 생성되었습니다!</h3>

            <a
                    id="shortUrl"
                    class="short-url"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
            ></a>

            <div class="actions">
                <button class="secondary-button" onclick="copyUrl()">
                    URL 복사
                </button>

                <button onclick="openUrl()">
                    바로가기 ↗
                </button>
            </div>

            <div class="original-url" id="originalResult"></div>

        </div>

    </div>

    <!-- URL 통계 -->
    <div class="card">

        <h2>📊 단축 URL 통계 조회</h2>

        <label for="shortenUrlKey">단축 URL 키</label>

        <div class="input-group">

            <input
                    type="text"
                    id="shortenUrlKey"
                    placeholder="8글자 키 입력"
                    maxlength="8"
            >

            <button onclick="getStatistics()">
                조회하기
            </button>

        </div>

        <p class="message" id="statsMessage"></p>

        <div class="stats" id="statsResult">

            <p class="stats-label">총 리다이렉트 횟수</p>

            <div class="stats-count" id="redirectCount">
                0
            </div>

            <p class="original-url" id="statsOriginalUrl"></p>

        </div>

    </div>

</div>

<footer>
    Linkly — Spring Boot URL Shortener Project
</footer>

<script>

    let generatedUrl = "";

    // 1. 단축 URL 생성
    document.getElementById("shortenForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const originalUrl =
                document.getElementById("originalUrl").value.trim();

            const button = document.getElementById("createButton");

            document.getElementById("createMessage").innerText = "";
            document.getElementById("result").style.display = "none";

            button.disabled = true;

            try {

                const response = await fetch("/shortenUrl", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        originalUrl: originalUrl
                    })
                });

                if (!response.ok) {
                    throw new Error("URL 생성에 실패했습니다.");
                }

                const data = await response.json();

                const shortenUrlKey = data.shortenUrlKey;

                generatedUrl =
                    window.location.origin + "/" + shortenUrlKey;

                const link = document.getElementById("shortUrl");

                link.innerText = generatedUrl;
                link.href = generatedUrl;

                document.getElementById("originalResult").innerText =
                    "원본 URL: " + data.originalUrl;

                document.getElementById("shortenUrlKey").value =
                    shortenUrlKey;

                document.getElementById("result").style.display = "block";

            } catch (error) {

                document.getElementById("createMessage").innerText =
                    error.message;

            } finally {

                button.disabled = false;
            }

        });


    // 2. URL 복사
    async function copyUrl() {

        if (!generatedUrl) return;

        try {
            await navigator.clipboard.writeText(generatedUrl);
            alert("URL이 복사되었습니다!");
        } catch (error) {
            alert("복사에 실패했습니다.");
        }

    }


    // 3. 단축 URL 이동
    function openUrl() {

        if (!generatedUrl) return;

        window.open(generatedUrl, "_blank", "noopener,noreferrer");

    }


    // 4. 리다이렉트 통계 조회
    async function getStatistics() {

        const key =
            document.getElementById("shortenUrlKey").value.trim();

        if (!key) {
            document.getElementById("statsMessage").innerText =
                "단축 URL 키를 입력해주세요.";
            return;
        }

        document.getElementById("statsMessage").innerText = "";
        document.getElementById("statsResult").style.display = "none";

        try {

            const response = await fetch(
                "/shortenUrl/" + encodeURIComponent(key)
            );

            if (!response.ok) {
                throw new Error("조회에 실패했습니다.");
            }

            const data = await response.json();

            document.getElementById("redirectCount").innerText =
                data.redirectCount;

            document.getElementById("statsOriginalUrl").innerText =
                "원본 URL: " + data.originalUrl;

            document.getElementById("statsResult").style.display = "block";

        } catch (error) {

            document.getElementById("statsMessage").innerText =
                error.message;

        }

    }

</script>

</body>
</html>
